name: Comprobar ejemplos de Java

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compilar y ejecutar todas las lecciones
        run: bash tools/check-examples.sh
